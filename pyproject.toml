[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carboniq-sdk"
version = "0.2.0"
description = "CarbonIQ — Carbon-aware computing SDK, AST sustainable code generator, and CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "CarbonIQ Team", email = "team@carboniq.internal" }
]
keywords = [
    "carbon-footprint",
    "sustainability",
    "green-software",
    "energy-efficiency",
    "carbon-aware",
    "ast-codegen"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring"
]
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
hardware = [
    "codecarbon>=2.8.0",
]
all = [
    "codecarbon>=2.8.0",
]

[project.scripts]
carboniq = "carboniq.cli.carboniq_cli:cli"

[project.urls]
Homepage = "https://carboniq-capstone.vercel.app"
Repository = "https://github.com/Kingslaye-varun/CarbonIQ_Capstone"
Documentation = "https://github.com/Kingslaye-varun/CarbonIQ_Capstone#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["carboniq*"]
exclude = ["backend*", "frontend*", "docs*", "measurements*", "tests*", "cli*"]

[tool.pyrefly]
search-path = [".", "backend", "carboniq"]
project-excludes = ["**/node_modules", "**/__pycache__", "**/.venv/**/*", "**/venv/**/*"]
