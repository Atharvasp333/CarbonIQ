[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carboniq"
version = "0.2.0"
description = "Carbon-aware computing SDK and sustainable code generator"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "CarbonIQ Team", email = "team@carboniq.internal" }
]
keywords = [
    "carbon-footprint",
    "sustainability",
    "green-software",
    "codecarbon",
    "energy-efficiency"
]
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "codecarbon>=2.8.0",
]

[project.scripts]
carboniq = "cli.carboniq_cli:cli"

[tool.setuptools.packages.find]
include = ["carboniq*", "cli*"]
