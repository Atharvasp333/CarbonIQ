services:
  - type: web
    name: carboniq-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CREDS_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELECTRICITY_MAPS_API_KEY
        sync: false
      - key: CLIMATIQ_API_KEY
        sync: false
      - key: NEON_AUTH_URL
        sync: false
