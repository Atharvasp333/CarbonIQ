name: Bug Report
description: Create a report to help us reproduce and resolve a bug in CarbonIQ.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of CarbonIQ is affected?
      options:
        - "Python SDK (carboniq)"
        - "CLI Tool (carboniq CLI)"
        - "Backend API (FastAPI)"
        - "Frontend Dashboard (React)"
        - "VS Code Extension"
        - "Packaging / PyPI"
        - "Documentation"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CarbonIQ Version
      description: e.g., carboniq-sdk 0.2.0, or git commit SHA
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating System & Python Version
      description: e.g., Ubuntu 24.04 / Python 3.12, Windows 11 / Python 3.11
      placeholder: "OS: Ubuntu 24.04, Python: 3.12"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or code snippet to reproduce the issue.
      placeholder: |
        1. Run `carboniq audit <script.py>`
        2. Observe error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Traceback
      description: Please paste any relevant command-line logs or Python stack traces.
      render: shell
