name: Release CarbonIQ SDK to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate, Test, and Build Distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate Release Tag, Commit SHA, and pyproject.toml
        env:
          EXPECTED_COMMIT: ${{ vars.AUDITED_RELEASE_SHA }}
          EXPECTED_VERSION: "0.2.0"
          EXPECTED_REPO: "Kingslaye-varun/CarbonIQ_Capstone"
        run: |
          TAG_NAME="${{ github.ref_name }}"
          CLEAN_TAG=$(echo "$TAG_NAME" | sed -E 's/^(sdk-)?v?//')
          PYPROJECT_VERSION=$(grep -E '^version = ' pyproject.toml | head -n1 | cut -d '"' -f2)
          CURRENT_COMMIT=$(git rev-parse HEAD)
          CURRENT_REPO="${{ github.repository }}"

          echo "GitHub Repository:      $CURRENT_REPO"
          echo "GitHub Release Tag:     $TAG_NAME"
          echo "Cleaned Semantic Tag:   $CLEAN_TAG"
          echo "pyproject.toml Version: $PYPROJECT_VERSION"
          echo "Expected Release SHA:   $EXPECTED_COMMIT"
          echo "Checked out Commit SHA: $CURRENT_COMMIT"

          if [ "$CURRENT_REPO" != "$EXPECTED_REPO" ]; then
            echo "::error::Release execution aborted: Repository '$CURRENT_REPO' does not match trusted deployment repository '$EXPECTED_REPO'!"
            exit 1
          fi

          if [ "$CLEAN_TAG" != "$EXPECTED_VERSION" ]; then
            echo "::error::Tag version '$CLEAN_TAG' does not match expected version '$EXPECTED_VERSION'!"
            exit 1
          fi

          if [ "$PYPROJECT_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::pyproject.toml version '$PYPROJECT_VERSION' does not match expected '$EXPECTED_VERSION'!"
            exit 1
          fi

          if [ -z "$EXPECTED_COMMIT" ]; then
            echo "::error::Required repository variable AUDITED_RELEASE_SHA is missing or empty! Configure it in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::AUDITED_RELEASE_SHA '$EXPECTED_COMMIT' is not a valid 40-character hexadecimal commit SHA!"
            exit 1
          fi

          if [ "$CURRENT_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Security violation: Checked out commit '$CURRENT_COMMIT' does not match audited release SHA '$EXPECTED_COMMIT'!"
            exit 1
          fi

          echo "Repository identity, version, and exact audited commit verification passed successfully."

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate package metadata and readme rendering
        run: |
          python -m twine check --strict dist/*

      - name: Scan distribution archives for prohibited files & secrets
        run: |
          python -c '
          import zipfile, tarfile, sys, glob

          wheel_files = glob.glob("dist/*.whl")
          if not wheel_files:
              print("No wheel artifact found!"); sys.exit(1)

          with zipfile.ZipFile(wheel_files[0], "r") as z:
              names = z.namelist()
              for name in names:
                  if any(bad in name.lower() for bad in [".env", "measurements/", "backend/", "frontend/"]):
                      print(f"SECURITY VIOLATION: prohibited file {name} in wheel!"); sys.exit(1)
                  content = z.read(name).decode("utf-8", errors="ignore")
                  if "BEGIN RSA" in content or "BEGIN OPENSSH" in content:
                      print(f"SECURITY VIOLATION: private key detected in {name}!"); sys.exit(1)

          print("Distribution security inspection passed cleanly.")
          '

      - name: Run unit, CLI, and repository compatibility tests
        run: |
          python -m pip install pytest
          pytest tests/test_sdk_api.py tests/test_cli_commands.py tests/test_packaging_and_security.py tests/test_carbon_aware_integration.py -v

      - name: Run installed-wheel isolation tests from clean directory
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install dist/*.whl

          # Verify SDK import
          python -c "import carboniq; print('SDK loaded, version:', carboniq.__version__)"

          # Run from /tmp to verify clean isolated execution outside repo tree
          (cd /tmp && python -c "import carboniq; assert carboniq.__version__ == '0.2.0'")
          (cd /tmp && python -c "import importlib.util; assert importlib.util.find_spec('cli') is None, 'Generic cli collision detected!'")

          # Verify CLI entry point and commands from outside repo
          (cd /tmp && carboniq --help)
          (cd /tmp && carboniq audit --help)
          (cd /tmp && carboniq optimize --help)
          (cd /tmp && carboniq recommend-schedule --help)
          (cd /tmp && carboniq deploy-analysis --help)
          (cd /tmp && carboniq carbon-intensity --help)

          # Test functional CLI command with clean sample
          echo 'def f(n): return [x*2 for x in range(n)]' > /tmp/sample_workload.py
          (cd /tmp && carboniq audit /tmp/sample_workload.py)
          (cd /tmp && carboniq optimize /tmp/sample_workload.py)
          rm -f /tmp/sample_workload.py

          deactivate
          rm -rf test_env
          echo "Clean isolated installation verification passed."

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pypi-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-to-pypi:
    name: Publish to PyPI via Trusted Publishing (OIDC)
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/carboniq-sdk
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: pypi-artifacts
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1.12.4
        with:
          packages-dir: dist/
          print-hash: true
